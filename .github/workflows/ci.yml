name: Mily Platform CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  minecraft-pipeline:
    runs-on: ubuntu-latest
    name: Mincraft 26.2 Pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Detect Minecraft artifact
        id: mc
        run: |
          ARTIFACT=$(find . -path '*/test_client/*.jar' -name '*26.2*' 2>/dev/null | head -1)
          if [ -n "$ARTIFACT" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=$ARTIFACT" >> $GITHUB_OUTPUT
            echo "SHA=$(sha256sum "$ARTIFACT" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
            echo "[MC] Found: $ARTIFACT"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "[MC] No 26.2 JAR found — skipping decompile pipeline in CI"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Mincraft artifact
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:verifyMinecraftArtifact --no-daemon --console=plain
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: Process Mincraft (verify + extract)
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:prepareMinecraft --no-daemon --console=plain
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: Decompile Mincraft (CFR)
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:decompileMinecraft --no-daemon --console=plain
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: Generate Mincraft integration metadata
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:generateMinecraftIntegration --no-daemon --console=plain
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: Report
        if: steps.mc.outputs.found == 'true'
        run: |
          echo "[MC] decompiled build/minecraft/decompiled/:"
          find mili-minecraft-integration/build/minecraft/decompiled -name "*.java" 2>/dev/null | wc -l
          echo "[MC] Generated metadata:"
          cat mili-minecraft-integration/build/minecraft/metadata/minecraft.json 2>/dev/null || echo "N/A"
          echo ""
          echo "[MC] Build report:"
          cat mili-minecraft-integration/build/minecraft/metadata/minecraft-build-report.json 2>/dev/null || echo "N/A"

  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test (Java 25)
    needs: minecraft-pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile (incl. Minecraft metadata gen if artifact present)
        run: ./gradlew compileJava compileTestJava --no-daemon --console=plain

      - name: Run all tests
        run: ./gradlew test --no-daemon --console=plain

      - name: Build platform fat JAR
        run: ./gradlew :mili-loader:shadowJar --no-daemon --console=plain

      - name: Verify platform descriptor (META-INF/mili/platform.json)
        run: |
          JAR=$(find mili-loader/build/libs -name 'mili-*.jar' | grep -v sources | grep -v javadoc | head -1)
          echo "Platform JAR: $JAR"
          unzip -p "$JAR" META-INF/mili/platform.json | python3 -m json.tool > /dev/null \
            || { echo "platform.json missing or invalid"; exit 1; }
          echo "platform.json OK"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/'

      - name: Upload platform JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mili-platform
          path: mili-loader/build/libs/mili-*.jar

  module-boundary-check:
    runs-on: ubuntu-latest
    name: Module Boundary Validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava --no-daemon --console=plain

      - name: Verify runtime module does not import minecraft-integration or loader
        run: |
          if grep -rE "import org\.loader\.(runtime\.minecraft|loader)" mili-runtime/src/main/java/ ; then
            echo "ERROR: mili-runtime must not import minecraft or loader packages"
            exit 1
          fi

      - name: Verify abi module has zero loader/runtime/minecraft imports
        run: |
          if grep -rE "import org\.loader\.(runtime|loader)" mili-abi/src/main/java/ ; then
            echo "ERROR: mili-abi must be zero-dep on runtime/loader"
            exit 1
          fi

      - name: Verify dependency graph
        run: |
          echo "--- runtime deps ---"
          ./gradlew :mili-runtime:dependencies --configuration runtimeClasspath --no-daemon --console=plain | grep -E "mili-|---" || true
          echo "--- abi deps ---"
          ./gradlew :mili-abi:dependencies --configuration runtimeClasspath --no-daemon --console=plain | grep -E "mili-|---" || true
