name: Mili Platform CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['25']

    name: Build & Test (Java ${{ matrix.java }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile all modules
        run: ./gradlew compileJava compileTestJava --no-daemon --console=plain --no-refresh-dependencies

      - name: Run all tests
        run: ./gradlew test --no-daemon --console=plain --no-refresh-dependencies

      - name: Build platform fat JAR
        run: ./gradlew :mili-loader:shadowJar --no-daemon --console=plain

      - name: Verify platform descriptor (META-INF/mili/platform.json)
        run: |
          JAR=$(find mili-loader/build/libs -name 'mili-*.jar' | grep -v sources | grep -v javadoc | head -1)
          echo "Platform JAR: $JAR"
          unzip -p "$JAR" META-INF/mili/platform.json | python3 -m json.tool > /dev/null \
            || { echo "platform.json missing or invalid JSON"; exit 1; }
          echo "platform.json OK"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: '**/build/test-results/test/'

      - name: Upload platform JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mili-platform-java-${{ matrix.java }}
          path: mili-loader/build/libs/mili-*.jar

  module-boundary-check:
    runs-on: ubuntu-latest
    name: Module Boundary Validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile (boundary check runs against compiled classes)
        run: ./gradlew compileJava --no-daemon --console=plain

      - name: Verify runtime module does not import minecraft-integration or loader
        run: |
          if grep -rE "import org\.loader\.(runtime\.minecraft|loader|minecraftintegration)" mili-runtime/src/main/java/ ; then
            echo "ERROR: mili-runtime must not import minecraft or loader packages"
            exit 1
          fi

      - name: Verify abi module has zero loader/runtime/minecraft imports
        run: |
          if grep -rE "import org\.loader\.(runtime|loader|minecraftintegration)" mili-abi/src/main/java/ ; then
            echo "ERROR: mili-abi must be zero-dep on runtime/loader/minecraft"
            exit 1
          fi

      - name: Verify dependency graph
        run: |
          echo "--- runtime dependencies ---"
          ./gradlew :mili-runtime:dependencies --configuration runtimeClasspath --no-daemon --console=plain | grep -E "mili-|---" || true
          echo "--- abi dependencies (should be empty) ---"
          ./gradlew :mili-abi:dependencies --configuration runtimeClasspath --no-daemon --console=plain | grep -E "mili-|---" || true

      - name: Verify no hardcoded 'E:\\loader' in source
        run: |
          if grep -rE "E:\\\\loader" --include=*.java --include=*.kt --include=*.kts . ; then
            echo "ERROR: hardcoded 'E:\\loader' detected. Use relative/path-param."
            exit 1
          fi
