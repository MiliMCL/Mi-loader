name: Mili Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['25']

    name: Build & Test (Java ${{ matrix.java }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile all modules
        run: ./gradlew compileJava compileTestJava --no-daemon --console=plain

      - name: Run unit & integration tests
        run: ./gradlew test --no-daemon --console=plain

      - name: Produce release JARs
        run: ./gradlew jar --no-daemon --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}
          path: '**/build/test-results/test/'

      - name: Upload JAR artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mili-jars-java-${{ matrix.java }}
          path: '**/build/libs/*.jar'

  module-boundary-check:
    runs-on: ubuntu-latest
    name: Module Boundary Validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify no minecraft references inside runtime module
        run: |
          if grep -r "import org.loader.runtime.minecraft" mili-runtime/src/main/java/ ; then
            echo "ERROR: runtime module must not import minecraft module"
            exit 1
          fi

      - name: Verify dependency graph
        run: ./gradlew dependencies --no-daemon --console=plain | grep -E "(mili-abi|mili-runtime|mili-loader|mili-minecraft-integration)" || true
