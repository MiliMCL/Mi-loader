name: Mili Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG"   >> $GITHUB_ENV
          echo "version=$TAG"       >> $GITHUB_OUTPUT
          echo "Tag: ${GITHUB_REF_NAME} -> version $TAG"

      - name: Verify tag matches gradle.properties
        run: |
          PROP=$(grep '^miliPlatformVersion=' gradle.properties | cut -d= -f2)
          if [ "$PROP" != "$TAG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} != miliPlatformVersion=${PROP}"
            exit 1
          fi
          echo "Tag matches gradle.properties (${PROP})"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle (dependency graph + cache)
        uses: gradle/actions/setup-gradle@v4
        
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build + full test matrix
        run: ./gradlew clean test --no-daemon --console=plain --no-refresh-dependencies

      - name: Build platform fat JAR
        run: ./gradlew :mili-loader:shadowJar :mili-loader:releaseArtifacts --no-daemon --console=plain

      - name: Show release artifacts
        run: echo "--- SHA256SUMS ---" && cat mili-loader/build/release/SHA256SUMS 2>/dev/null || true && echo && echo "--- release-manifest.json ---" && cat mili-loader/build/release/release-manifest.json 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mili Platform ${{ env.TAG_VERSION }} (MC 26.2)"
          body: |
            Mili Platform ${{ env.TAG_VERSION }} for Minecraft 26.2 / Java 25.

            ABI: 1 — locked. Mods must declare the matching `mili` triple in mod.json.

            Assets:
            - Platform JAR (shadow): `mili-${{ env.TAG_VERSION }}-mc26.2.jar` (runs on any Java 25+)
            - SHA256SUMS
            - release-manifest.json
          files: |
            mili-loader/build/release/mili-*.jar
            mili-loader/build/release/SHA256SUMS
            mili-loader/build/release/release-manifest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact snapshot (for auditing)
        uses: actions/upload-artifact@v4
        with:
          name: mili-release-${{ env.TAG_VERSION }}
          path: mili-loader/build/release/
          if-no-files-found: warn
