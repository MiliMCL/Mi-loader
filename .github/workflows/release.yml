name: Mili Platform Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG"   >> $GITHUB_ENV
          echo "version=$TAG"       >> $GITHUB_OUTPUT
          echo "Tag: ${GITHUB_REF_NAME} -> version $TAG"

      - name: Verify tag matches minecraft version in gradle.properties
        run: |
          # Tag format: v<minecraftVersion>  (e.g. v26.2 -> minecraftVersion=26.2)
          MC=$(grep '^minecraftVersion=' gradle.properties | cut -d= -f2)
          if [ "$MC" != "$TAG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} != minecraftVersion=${MC}"
            exit 1
          fi
          echo "Tag v${TAG_VERSION} matches minecraftVersion=${MC}"

      - name: Fetch Minecraft client JAR (official Mojang source)
        id: mc
        run: |
          set -euo pipefail
          MC_VER=$(grep '^minecraftVersion=' gradle.properties | cut -d= -f2)
          META_URL=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(v['url'] for v in d['versions'] if v['id']=='$MC_VER'))")
          read -r CLIENT_URL CLIENT_SHA1 <<<"$(curl -fsSL "$META_URL" \
            | python3 -c "import json,sys; c=json.load(sys.stdin)['downloads']['client']; print(c['url'], c['sha1'])")"
          mkdir -p test_client
          curl -fsSL -o "test_client/${MC_VER}.jar" "$CLIENT_URL"
          echo "${CLIENT_SHA1}  test_client/${MC_VER}.jar" | sha1sum -c -
          {
            echo "found=true"
            echo "path=test_client/${MC_VER}.jar"
            echo "size=$(stat -c%s "test_client/${MC_VER}.jar")"
            echo "sha=$(sha256sum "test_client/${MC_VER}.jar" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          echo "[MC] Fetched $CLIENT_URL -> test_client/${MC_VER}.jar"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Minecraft Integration Pipeline ──────────────────────────────────────
      - name: "[MC] Verify artifact"
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:verifyMinecraftArtifact --no-daemon --console=plain --no-configuration-cache
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: "[MC] Prepare (bundler normalize)"
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:prepareMinecraft --no-daemon --console=plain --no-configuration-cache
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: "[MC] Decompile (CFR)"
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:decompileMinecraft --no-daemon --console=plain --no-configuration-cache
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: "[MC] Generate integration metadata"
        if: steps.mc.outputs.found == 'true'
        run: ./gradlew :mili-minecraft-integration:generateMinecraftIntegration --no-daemon --console=plain --no-configuration-cache
        env:
          MINECRAFT_ARTIFACT: ${{ steps.mc.outputs.path }}

      - name: "[MC] Summary"
        if: steps.mc.outputs.found == 'true'
        run: |
          echo "--- decompiled sources ---"
          find mili-minecraft-integration/build/minecraft/decompiled -name "*.java" 2>/dev/null | wc -l
          echo "--- minecraft.json ---"
          cat mili-minecraft-integration/build/minecraft/metadata/minecraft.json 2>/dev/null || echo "N/A"
          echo "--- build report (truncated) ---"
          head -8 mili-minecraft-integration/build/minecraft/metadata/minecraft-build-report.json 2>/dev/null || echo "N/A"

      # ── Full Build + Test ──────────────────────────────────────────────────
      - name: Compile + test all modules (with MC integration)
        run: ./gradlew clean compileTestJava test --no-daemon --console=plain --no-configuration-cache

      - name: Build platform fat JAR
        run: ./gradlew :mili-loader:shadowJar --no-daemon --console=plain --no-configuration-cache

      - name: Verify platform JAR (MCP descriptor + MC fingerprint)
        run: ./gradlew :mili-loader:verifyPlatformJar --no-daemon --console=plain --no-configuration-cache

      - name: Generate release artifacts (SHA256SUMS + release-manifest.json)
        run: ./gradlew :mili-loader:releaseArtifacts --no-daemon --console=plain --no-configuration-cache

      - name: Show release artifacts
        run: |
          echo "--- SHA256SUMS ---"
          cat mili-loader/build/release/SHA256SUMS 2>/dev/null
          echo ""
          echo "--- release-manifest.json ---"
          cat mili-loader/build/release/release-manifest.json 2>/dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mili Platform ${{ env.TAG_VERSION }} (MC 26.2)"
          body: |
            Mili Platform ${{ env.TAG_VERSION }} for Minecraft 26.2 / Java 25.

            MC Build Fingerprint:
            - MC version: 26.2
            - MC artifact SHA-256: ${{ steps.mc.outputs.sha || 'N/A' }}
            - Decompiled: ${{ steps.mc.outputs.found == 'true' }}

            Modules:
            - mili-abi: stable ABI (zero-dep)
            - mili-runtime: Scope/Scheduler/EventBus/Capability
            - mili-loader: bootstrap + discovery + classloading + lifecycle
            - mili-minecraft-integration: MC 26.2 bridge + reflection tick

            All Mods must declare the `mili` triple in META-INF/mod.json.
          files: |
            mili-loader/build/release/mili-*.jar
            mili-loader/build/release/SHA256SUMS
            mili-loader/build/release/release-manifest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mili-release-${{ env.TAG_VERSION }}
          path: mili-loader/build/release/
          if-no-files-found: warn
