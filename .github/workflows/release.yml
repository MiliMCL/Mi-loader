name: Mili Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Full build and test
        run: ./gradlew clean build test --no-daemon --console=plain

      - name: Generate SHA256SUMS
        run: |
          cd E:\loader || true
          mkdir -p release-artifacts
          cp **/build/libs/*.jar release-artifacts/ 2>/dev/null || true
          cd release-artifacts && sha256sum *.jar > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mili-release
          path: '**/build/libs/*.jar'
