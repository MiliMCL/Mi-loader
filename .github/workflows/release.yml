name: Mili Platform Release

on:
  push:
    # 监听所有 tag，不强制 v 前缀。约定：tag 就是纯版本号，如 0.1.0
    tags: ['*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          # tag 不承载版本语义，仅作为标签使用。
          # 唯一的版本真相源是 gradle.properties 的 miliPlatformVersion。
          VER=$(grep '^miliPlatformVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "TAG_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "PLATFORM_VERSION=$VER"        >> $GITHUB_ENV
          echo "version=$VER"                 >> $GITHUB_OUTPUT
          echo "Tag label: ${GITHUB_REF_NAME#v} / platform version: $VER"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build + full test matrix
        run: ./gradlew clean test --no-daemon --console=plain 

      - name: Build platform fat JAR
        run: ./gradlew :mili-loader:shadowJar --no-daemon --console=plain --no-configuration-cache

      - name: Verify platform JAR (MCP descriptor + MC fingerprint)
        run: ./gradlew :mili-loader:verifyPlatformJar --no-daemon --console=plain --no-configuration-cache

      - name: Generate release artifacts (SHA256SUMS + release-manifest.json)
        run: ./gradlew :mili-loader:releaseArtifacts --no-daemon --console=plain --no-configuration-cache

      - name: Build ready-to-run distributions (tar.gz + zip)
        run: ./gradlew :mili-loader:distTar :mili-loader:distZip --no-daemon --console=plain --no-configuration-cache

      # The release job is the one that actually publishes, so the layout must be
      # asserted here too — a check that only lives in ci.yml lets a broken
      # archive ship unnoticed.
      - name: Verify distribution layout
        run: |
          TARBALL=$(ls mili-loader/build/distributions/*.tar.gz)
          ROOT=$(basename "$TARBALL" .tar.gz)
          LIST=$(tar tzf "$TARBALL" | sed 's:/$::' | sort)
          echo "--- archive contents ---"
          echo "$LIST"
          for p in "$ROOT/README.txt" \
                   "$ROOT/bin/mili-loader" \
                   "$ROOT/bin/mili-loader.bat"; do
            echo "$LIST" | grep -qx "$p" || { echo "ERROR: missing $p"; exit 1; }
          done
          # core/ must hold exactly the versioned platform JAR
          echo "$LIST" | grep -qE "^$ROOT/core/mili-[0-9.]+-mc[0-9.]+\.jar$" || \
            { echo "ERROR: platform JAR missing from core/"; exit 1; }
          echo "$LIST" | grep -qx "$ROOT/mods/.keep" || \
            { echo "ERROR: mods/.keep missing"; exit 1; }
          # No accidental directory-in-directory such as README.txt/README.txt
          echo "$LIST" | grep -qE "^$ROOT/[^/]+/[^/]+/[^/]+" && \
            { echo "ERROR: unexpected nesting depth in archive"; exit 1; }
          echo "distribution layout OK (root=$ROOT)"

      - name: Show release artifacts
        run: |
          echo "--- SHA256SUMS ---"
          cat mili-loader/build/release/SHA256SUMS 2>/dev/null
          echo ""
          echo "--- distributions ---"
          ls -lh mili-loader/build/distributions/ 2>/dev/null || echo "none"
          echo ""
          echo "--- release-manifest.json ---"
          cat mili-loader/build/release/release-manifest.json 2>/dev/null

      - name: Stage distributions into release dir
        run: |
          mkdir -p mili-loader/build/release
          cp mili-loader/build/distributions/*.tar.gz mili-loader/build/release/ 2>/dev/null || true
          cp mili-loader/build/distributions/*.zip mili-loader/build/release/ 2>/dev/null || true
          # Recompute SHA256SUMS so it covers distributions too
          cd mili-loader/build/release
          sha256sum mili-*.jar mili-*.tar.gz mili-*.zip > SHA256SUMS 2>/dev/null || \
            sha256sum mili-*.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mili Platform ${{ env.PLATFORM_VERSION }} (MC 26.2)"
          body: |
            Mili Platform ${{ env.PLATFORM_VERSION }} for Minecraft 26.2 / Java 25.

            ## 快速开始
            下载 `mili-*-mc26.2.tar.gz`（Windows 用 `.zip`），解压后运行：
            - Linux/macOS: `./bin/mili-loader`
            - Windows: `bin\mili-loader.bat`

            首次运行会自动从 Mojang 官方 CDN 下载 Minecraft 26.2 并逐个校验
            SHA-1（约 600MB），完成后游戏自动启动。之后启动不再重复下载。

            分发包中**不包含** Minecraft 本体 —— 既遵守 Mojang 使用条款，
            也让分发包保持在 KB 级。

            ## MC Build Fingerprint
            - MC version: 26.2

            ## Modules
            - mili-abi: stable ABI (zero-dep)
            - mili-runtime: Scope/Scheduler/EventBus/Capability
            - mili-loader: bootstrap + discovery + classloading + lifecycle
            - mili-minecraft-integration: MC 26.2 bridge + reflection tick
            - mili-installer: official-source fetcher with SHA-1 verification

            All Mods must declare the `mili` triple in META-INF/mod.json.
          files: |
            mili-loader/build/release/mili-*.jar
            mili-loader/build/release/mili-*.tar.gz
            mili-loader/build/release/mili-*.zip
            mili-loader/build/release/SHA256SUMS
            mili-loader/build/release/release-manifest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mili-release-${{ env.TAG_VERSION }}
          path: mili-loader/build/release/
          if-no-files-found: warn
