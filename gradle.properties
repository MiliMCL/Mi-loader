# Mili Platform Version Lock
# These are the canonical, authoritative versions. Modules MUST match exactly.
miliPlatformVersion=0.1.0
miliAbiVersion=1
minecraftVersion=26.2
javaVersion=25

# ── 字节码工具链 ────────────────────────────────────────────────────────────────
# ASM 版本与 javaVersion 强绑定，不能随意下调
#
# Minecraft 26.2 的 class 文件 major version 是 69（Java 25）。
# ASM 9.7 在读到 major 69 时抛 IllegalArgumentException:
#   "Unsupported class file major version 69"
# ASM 9.8（2025-03-29）才引入 Opcodes.V25 / 支持 Java 25。
#
# 因此：升级 javaVersion 时必须同步核对这个值。
asmVersion=9.9.1

# asm-analysis / asm-util 单独锁定。
#
# 原因：这两个 artifact 的 9.9.1 在离线缓存中不存在（只有 9.8），
# 而 asm / asm-tree / asm-commons 的 9.9.1 齐全。Gradle 离线模式下
# 缺一个 artifact 就会让整条 compileClasspath 解析失败。
#
# 9.8 与 9.9.1 都支持 Java 25（class major 69），而 BytecodeVerifier
# 用的 Analyzer / SimpleVerifier 在 9.8 中完整存在（已核实 jar 内容），
# 因此这个降级是安全的。联网构建时可统一回 9.9.1。
asmAnalysisVersion=9.8

# Build settings
org.gradle.jvmargs=-Xmx512m
org.gradle.parallel=true
org.gradle.caching=true
